x-service: &service
  restart: unless-stopped
  environment:
    SPRING_PROFILES_ACTIVE: docker
    SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    JAVA_TOOL_OPTIONS: -Xmx256m
  depends_on:
    mongo:
      condition: service_started
    config-server:
      condition: service_healthy
    eureka-server:
      condition: service_healthy

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  config-server:
    build: ../../config-server
    ports:
      - "8888:8888"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8888"]
      interval: 5s
      retries: 20
      start_period: 20s

  eureka-server:
    build: ../../eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8761"]
      interval: 5s
      retries: 20
      start_period: 20s

  customer-service:
    <<: *service
    build: ../../customer-service

  account-service:
    <<: *service
    build: ../../account-service

  credit-service:
    <<: *service
    build: ../../credit-service

  transaction-service:
    <<: *service
    build: ../../transaction-service

  report-service:
    <<: *service
    build: ../../report-service

  api-gateway:
    <<: *service
    build: ../../api-gateway
    ports:
      - "8080:8080"

volumes:
  mongo-data: